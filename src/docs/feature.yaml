# OpenAPI Specification for Feature Management Endpoints

paths:
  /v1/feature:
    get:
      tags:
        - Feature
      summary: Get all features
      description: |
        Retrieve all feature/subscription plans from the system.
      operationId: getAllFeatures
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: locationId
          required: false
          schema:
            type: string
            format: uuid
          description: Filter features by location membership
        - in: query
          name: tier
          required: false
          schema:
            type: string
          description: Filter by subscription tier
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Filter active or inactive features
      responses:
        "200":
          description: Features retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Features retrieved successfully"
                  data:
                    type: array
                    items:
                      type: object
        "401":
          description: Unauthorized - Invalid or missing authentication
        "500":
          description: Server error while retrieving features

  /v1/feature/{id}:
    get:
      tags:
        - Feature
      summary: Get feature by ID
      description: |
        Retrieve a specific feature/subscription plan by its ID.
      operationId: getFeatureById
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Feature ID (subscription plan ID)
      responses:
        "200":
          description: Feature retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Feature retrieved successfully"
                  data:
                    type: object
                    description: Feature object
        "401":
          description: Unauthorized - Invalid or missing authentication
        "404":
          description: Feature not found
        "500":
          description: Server error while retrieving feature

  /v1/feature/update:
    patch:
      tags:
        - Feature
      summary: Update feature settings
      description: |
        Update feature/subscription plan settings.
        Only users with ADMIN or ASSISTANT roles are authorized to use this endpoint.
      operationId: updateFeature
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - updates
              properties:
                id:
                  type: string
                  format: uuid
                  description: Feature ID (subscription plan ID)
                featureId:
                  type: string
                  format: uuid
                  description: Alternate feature ID field
                planId:
                  type: string
                  format: uuid
                  description: Alternate feature ID field used by pricing callers
                updates:
                  type: object
                  description: Key-value pairs of fields to update
                  example: {
                    "price": 199.99,
                    "jobApplications": 50,
                    "cvResumeRequests": 10,
                    "isActive": true
                  }
                feature:
                  type: object
                  description: Alternate update payload used by some callers
      responses:
        "200":
          description: Feature updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Feature updated successfully"
                  data:
                    type: object
                    description: Updated feature object
        "400":
          description: Invalid request - Missing or invalid parameters
        "401":
          description: Unauthorized - Invalid or missing authentication
        "403":
          description: Forbidden - Only admins and assistants can update features
        "404":
          description: Feature not found
        "500":
          description: Server error while updating feature
