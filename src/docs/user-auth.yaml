        Retrieves detailed information about a specific user.
        
        This endpoint requires authentication and proper authorization.
        User information is cached for performance optimization.
      operationId: getUserInfo
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the user to retrieve
          schema:
            type: string
            format: uuid
            example: "user-uuid-123"
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            description: User's unique identifier
                          email:
                            type: string
                            format: email
                            description: User's email address
                          firstName:
                            type: string
                            description: User's first name
                          lastName:
                            type: string
                            description: User's last name
                          role:
                            type: string
                            description: User's role
                          isEmailVerified:
                            type: boolean
                            description: Whether the user's email is verified
            examples:
              user_info_success:
                summary: User information retrieved
                value:
                  success: true
                  message: "User information retrieved successfully"
                  statusCode: 200
                  data:
                    user:
                      id: "user-uuid-123"
                      email: "john.doe@example.com"
                      firstName: "John"
                      lastName: "Doe"
                      role: "sales"
                      isEmailVerified: true
        '400':
          description: Bad request - Invalid user ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              example:
                success: false
                message: "Invalid user ID."
                statusCode: 400
                data: null
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              example:
                success: false
                message: "Unauthorized"
                statusCode: 401
                data: null

  /v1/user/dispatch-client:
    post:
      tags:
        - User Authentication
      summary: Dispatch client information to a PC (Placement Control)
      description: |
        Dispatches client information to a PC (Placement Control) by sending a Slack message
        with client details and credentials.
        
        This endpoint requires authentication and proper authorization.
        The PC receives client information including profile details, salary expectations,
        sample results link, and aggregator credentials.
        
        A Slack notification is sent asynchronously using setImmediate to inform
        the PC about the dispatched client information.
      operationId: dispatchClient
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pcId
              properties:
                pcId:
                  type: string
                  description: The unique identifier of the PC (Placement Control) to dispatch to
                  example: "pc-uuid-123"
                clientId:
                  type: string
                  description: Single client ID to dispatch (optional if userIds provided)
                  example: "client-uuid-456"
                userIds:
                  type: array
                  description: Array of client IDs to dispatch (optional if clientId provided)
                  items:
                    type: string
                  example: ["client-uuid-789", "client-uuid-101"]
            example:
              pcId: "pc-uuid-123"
              clientId: "client-uuid-456"
              userIds: ["client-uuid-789", "client-uuid-101"]
      responses:
        '200':
          description: Client dispatch completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    properties:
                      successCount:
                        type: number
                        description: Number of clients successfully dispatched
                      failedCount:
                        type: number
                        description: Number of clients that failed to dispatch
                      totalClients:
                        type: number
                        description: Total number of clients attempted
            examples:
              dispatch_success:
                summary: Client dispatch completed
                value:
                  success: true
                  message: "Client dispatch completed: 2 successful, 0 failed"
                  statusCode: 200
                  data:
                    successCount: 2
                    failedCount: 0
                    totalClients: 2
        '400':
          description: Bad request - Missing required parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              examples:
                missing_pc_id:
                  summary: PC ID required
                  value:
                    success: false
                    message: "PC ID is required"
                    statusCode: 400
                    data: null
                no_clients:
                  summary: No clients provided
                  value:
                    success: false
                    message: "At least one client ID must be provided"
                    statusCode: 400
                    data: null
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              example:
                success: false
                message: "Unauthorized"
                statusCode: 401
                data: null

  /v1/user/clients:
    get:
      tags:
        - User Authentication
      summary: Get all users with client role
      description: |
        Retrieves all users who have the 'client' role.
        
        This endpoint requires authentication and proper authorization.
        Returns a list of client users with sensitive information excluded.
      operationId: getClients
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Clients retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    properties:
                      clients:
                        type: array
                        description: List of client users
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: User's unique identifier
                            email:
                              type: string
                              format: email
                              description: User's email address
                            firstName:
                              type: string
                              description: User's first name
                            lastName:
                              type: string
                              description: User's last name
                            role:
                              type: string
                              description: User's role (always 'client')
                            isEmailVerified:
                              type: boolean
                              description: Whether the user's email is verified
                            createdAt:
                              type: string
                              format: date-time
                              description: User creation timestamp
                      count:
                        type: number
                        description: Total number of clients
            examples:
              clients_success:
                summary: Clients retrieved successfully
                value:
                  success: true
                  message: "Clients retrieved successfully"
                  statusCode: 200
                  data:
                    clients:
                      - id: "client-uuid-123"
                        email: "client1@example.com"
                        firstName: "Client"
                        lastName: "One"
                        role: "client"
                        isEmailVerified: true
                        createdAt: "2024-01-01T00:00:00.000Z"
                      - id: "client-uuid-456"
                        email: "client2@example.com"
                        firstName: "Client"
                        lastName: "Two"
                        role: "client"
                        isEmailVerified: false
                        createdAt: "2024-01-02T00:00:00.000Z"
                    count: 2
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              example:
                success: false
                message: "Unauthorized"
                statusCode: 401
                data: null

