                        lastName: "Two"
                        role: "PC"
                        isEmailVerified: false
                        createdAt: "2024-01-02T00:00:00.000Z"
                    count: 2
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              example:
                success: false
                message: "Unauthorized"
                statusCode: 401
                data: null

  /v1/user/logout:
    post:
      tags:
        - User Authentication
      summary: User logout
      description: |
        Logs out the currently authenticated user by blacklisting their token
        and clearing the authentication cookie.
        
        This endpoint requires authentication. The token is added to a blacklist
        to prevent reuse, and the HTTP-only cookie is cleared from the client.
        A Slack notification is sent to track logout events for security auditing.
      operationId: logoutUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Clears the HTTP-only access token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    properties: {}
            examples:
              logout_success:
                summary: Successful logout
                value:
                  success: true
                  message: "Logout successful"
                  statusCode: 200
                  data: {}
        '401':
          description: Unauthorized - Authentication required or no active session
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Error message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: null
                    description: No data returned
              examples:
                no_token:
                  summary: No token provided
                  value:
                    success: true
                    message: "No active session found"
                    statusCode: 200
                    data: null
                unauthorized:
                  summary: Unauthorized access
                  value:
                    success: false
                    message: "Unauthorized"
                    statusCode: 401
                    data: null

