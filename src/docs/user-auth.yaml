    get:
      tags:
        - User Authentication
      summary: Get current user profile
      description: |
        Retrieves the profile information of the currently authenticated user.
        
        This endpoint requires authentication and returns the full profile
        of the user making the request. User information is cached for
        performance optimization.
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    properties:
                      user:
