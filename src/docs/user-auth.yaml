          description: Placement Control (PC) users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    properties:
                      pcUsers:
                        type: array
                        description: List of assistant users returned as PC
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: User's unique identifier
                            email:
                              type: string
                              format: email
                              description: User's email address
                            firstName:
                              type: string
                              description: User's first name
                            lastName:
                              type: string
                              description: User's last name
                            role:
                              type: string
                              description: User's role (always 'PC')
                            isEmailVerified:
                              type: boolean
                              description: Whether the user's email is verified
                            createdAt:
                              type: string
                              format: date-time
                              description: User creation timestamp
                      count:
                        type: number
