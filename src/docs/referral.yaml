# OpenAPI Specification for Referrals Endpoints

paths:
  /v1/referrals:
    get:
      tags:
        - Referrals
      summary: Get aggregated referrals
      description: |
        Fetch all aggregated referrals grouped by referrer.
        Returns aggregated list with total referrals and amount owed.
      operationId: getReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 15
        - name: variance
          in: query
          required: false
          description: Filter mode
          schema:
            type: string
            enum: [claim]
      responses:
        "200":
          description: Referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            referrerEmail:
                              type: string
                              format: email
                              description: Email of referrer
                            referrerName:
                              type: string
                              description: Full name of referrer
                            referralCode:
                              type: string
                              description: Referral code
                            userId:
                              type: string
                              format: uuid
                            paymentStatus:
                              type: string
                              example: "paid"
                            businessName:
                              type: string
                            count:
                              type: integer
                              description: Total number of referrals
                            totalAmountOwed:
                              type: number
                              format: float
                              description: Total amount owed to referrer
                            referredUsers:
                              type: array
                              description: List of referred users
                      total:
                        type: integer
                        description: Total number of records
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/approve:
    post:
      tags:
        - Referrals
      summary: Approve referral claim
      description: |
        Approve a pending referral claim.
        Automatically sends Slack notification to CSM team.
      operationId: approveReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referralId
              properties:
                referralId:
                  type: string
                  format: uuid
                  description: ID of referral to approve
      responses:
        "200":
          description: Referral approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral approved successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/decline:
    post:
      tags:
        - Referrals
      summary: Decline referral claim
      description: |
        Decline a pending referral claim.
        Automatically sends Slack notification to CSM team.
      operationId: declineReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referralId
              properties:
                referralId:
                  type: string
                  format: uuid
                  description: ID of referral to decline
                reason:
                  type: string
                  description: Reason for declining (optional)
                  example: "Invalid referral claim"
      responses:
        "200":
          description: Referral declined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral declined successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/user/{userId}:
    get:
      tags:
        - Referrals
      summary: Get referrals for specific user
      description: Fetch all referrals made by a specific user
      operationId: getUserReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of user to get referrals for
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      referrals:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            status:
                              type: string
                              example: "APPROVED"
                            createdAt:
                              type: string
                              format: date-time
                      totalReferrals:
                        type: integer
                        description: Total number of referrals
                      totalSuccessfulReferrals:
                        type: integer
                        description: Number of approved referrals
        "400":
          description: Invalid user ID
        "401":
          description: Unauthorized
        "500":
          description: Server error