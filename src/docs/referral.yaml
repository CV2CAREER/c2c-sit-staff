# OpenAPI Specification for Referrals Endpoints

paths:
  /v1/referrals:
    get:
      tags:
        - Referrals
      summary: Get aggregated referrals
      description: |
        Fetch all individual referral records (one per referred user, not grouped by referrer).
        Supports filtering by deleted status and claim status.
      operationId: getReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 15
        - name: variance
          in: query
          required: false
          description: Filter mode — "claim" filters by CLAIMED status
          schema:
            type: string
            enum: [claim]
        - name: isDeleted
          in: query
          required: false
          description: Filter by deleted status. When omitted, only non-deleted records are returned. Pass `true` to return only deleted records.
          schema:
            type: boolean
        - name: claimStatus
          in: query
          required: false
          description: Filter by referral claim status (e.g. PENDING, CLAIMED, APPROVED, REJECTED)
          schema:
            type: string
            enum: [PENDING, CLAIMED, APPROVED, REJECTED]
      responses:
        "200":
          description: Referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            referralId:
                              type: string
                              format: uuid
                              description: Referral record ID
                            referrerEmail:
                              type: string
                              format: email
                              description: Email of referrer
                            referrerName:
                              type: string
                              description: Full name of referrer
                            referralCode:
                              type: string
                              description: Referral code
                            referredUserId:
                              type: string
                              format: uuid
                              description: Referred user ID
                            referredEmail:
                              type: string
                              format: email
                              description: Email of referred user
                            referredName:
                              type: string
                              description: Full name of referred user
                            status:
                              type: string
                              description: Referral claim status (PENDING, CLAIMED, APPROVED, REJECTED)
                            role:
                              type: string
                              description: Role of referred user
                            isClient:
                              type: boolean
                              description: Whether referred user is a paying client
                            paymentStatus:
                              type: string
                              example: "paid"
                            businessName:
                              type: string
                            amountOwed:
                              type: number
                              format: float
                              description: Amount owed for this referral ($50 if approved + client)
                            updatedBy:
                              type: string
                              nullable: true
                              description: Name/email of admin who last approved or declined
                            isDeleted:
                              type: boolean
                              description: Soft-delete flag
                            createdAt:
                              type: string
                              format: date-time
                      total:
                        type: integer
                        description: Total number of records
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/approve:
    post:
      tags:
        - Referrals
      summary: Approve referral claim
      description: |
        Approve a pending referral claim.
        Automatically sends Slack notification to CSM team.
      operationId: approveReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referralId
              properties:
                referralId:
                  type: string
                  format: uuid
                  description: ID of referral to approve
      responses:
        "200":
          description: Referral approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral approved successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/decline:
    post:
      tags:
        - Referrals
      summary: Decline referral claim
      description: |
        Decline a pending referral claim.
        Automatically sends Slack notification to CSM team.
      operationId: declineReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referralId
              properties:
                referralId:
                  type: string
                  format: uuid
                  description: ID of referral to decline
                reason:
                  type: string
                  description: Reason for declining (optional)
                  example: "Invalid referral claim"
      responses:
        "200":
          description: Referral declined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral declined successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/{referralId}:
    delete:
      tags:
        - Referrals
      summary: Soft-delete a referral record
      description: |
        Soft-delete a referral record by setting isDeleted to true.
        Automatically sends Slack notification to CSM team.
      operationId: deleteReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          description: ID of referral to delete
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Referral deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral deleted successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/{referralId}/restore:
    patch:
      tags:
        - Referrals
      summary: Restore a soft-deleted referral record
      description: |
        Restore a soft-deleted referral record by setting isDeleted to false.
        Automatically sends Slack notification to CSM team.
      operationId: restoreReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          description: ID of referral to restore
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Referral restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral restored successfully"
        "400":
          description: Invalid referral ID or referral is not deleted
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/{referralId}/permanent:
    delete:
      tags:
        - Referrals
      summary: Permanently delete a referral record
      description: |
        Permanently remove a referral record from the database.
        Automatically sends Slack notification to CSM team.
      operationId: permanentDeleteReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          description: ID of referral to permanently delete
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Referral permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral permanently deleted"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/user/{userId}:
    get:
      tags:
        - Referrals
      summary: Get referrals for specific user
      description: Fetch all referrals made by a specific user
      operationId: getUserReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of user to get referrals for
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      referrals:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            status:
                              type: string
                              example: "APPROVED"
                            createdAt:
                              type: string
                              format: date-time
                      totalReferrals:
                        type: integer
                        description: Total number of referrals
                      totalSuccessfulReferrals:
                        type: integer
                        description: Number of approved referrals
        "400":
          description: Invalid user ID
        "401":
          description: Unauthorized
        "500":
          description: Server error