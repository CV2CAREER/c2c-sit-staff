# OpenAPI Specification for Referrals Endpoints

paths:
  /v1/referrals:
    get:
      tags:
        - Referrals
      summary: Get aggregated referrals
      description: |
        Fetch all individual referral records (one per referred user, not grouped by referrer).
        Supports filtering by deleted status and claim status.
      operationId: getReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 15
        - name: variance
          in: query
          required: false
          description: Filter mode — "claim" filters by CLAIMED status
          schema:
            type: string
            enum: [claim]
        - name: isDeleted
          in: query
          required: false
          description: Filter by deleted status. When omitted, only non-deleted records are returned. Pass `true` to return only deleted records.
          schema:
            type: boolean
        - name: claimStatus
          in: query
          required: false
          description: Filter by referral claim status (e.g. PENDING, CLAIMED, APPROVED, REJECTED)
          schema:
            type: string
            enum: [PENDING, CLAIMED, APPROVED, REJECTED]
      responses:
        "200":
          description: Referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            referralId:
                              type: string
                              format: uuid
                              description: Referral record ID
                            referrerEmail:
                              type: string
                              format: email
                              description: Email of referrer
                            referrerName:
                              type: string
                              description: Full name of referrer
                            referralCode:
                              type: string
                              description: Referral code
                            referredUserId:
                              type: string
                              format: uuid
                              description: Referred user ID
                            referredEmail:
                              type: string
                              format: email
                              description: Email of referred user
                            referredName:
                              type: string
                              description: Full name of referred user
                            status:
                              type: string
                              description: Referral claim status (PENDING, CLAIMED, APPROVED, REJECTED)
                            role:
                              type: string
                              description: Role of referred user
                            isClient:
                              type: boolean
                              description: Whether referred user is a paying client
                            paymentStatus:
                              type: string
                              example: "paid"
                            businessName:
                              type: string
                            amountOwed:
                              type: number
                              format: float
                              description: Amount owed for this referral ($50 if approved + client)
                            updatedBy:
                              type: string
                              nullable: true
                              description: Name/email of admin who last approved or declined
                            isDeleted:
                              type: boolean
                              description: Soft-delete flag
                            createdAt:
                              type: string
                              format: date-time
                      total:
                        type: integer
                        description: Total number of records
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/partner/summary:
    get:
      tags:
        - Referrals
      summary: Get partner referral summary
      description: |
        Returns a partner's referral summary including total, invited, registered, and paid referral counts.
        Also returns total earnings (paid referrals × $10) and the partner's referral link.
        Includes a detailed list of all users referred by the authenticated partner.
      operationId: getPartnerSummary
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Partner summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Partner summary retrieved successfully"
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          totalReferrals:
                            type: integer
                            description: Total number of referral records
                            example: 5
                          invitedReferrals:
                            type: integer
                            description: Number of referrals with PENDING or CLAIMED status
                            example: 2
                          registeredReferrals:
                            type: integer
                            description: Number of referrals where the referred user exists and is not deleted
                            example: 3
                          paidReferrals:
                            type: integer
                            description: Number of referrals with PAID referralStatus or the referred user has paid
                            example: 1
                          totalEarnings:
                            type: integer
                            description: Total earnings (paid referrals × 10)
                            example: 10
                      referralLink:
                        type: string
                        description: Partner's unique referral link
                        example: "https://rat.cvtocareer.com/signup?referralCode=PARTNER123"
                      referredUsers:
                        type: array
                        description: List of users referred by this partner
                        items:
                          type: object
                          properties:
                            referralId:
                              type: string
                              format: uuid
                              description: Referral record ID
                            userId:
                              type: string
                              format: uuid
                              description: ID of the referred user
                            email:
                              type: string
                              format: email
                              nullable: true
                              description: Email of the referred user
                            firstName:
                              type: string
                              nullable: true
                              description: First name of the referred user
                            lastName:
                              type: string
                              nullable: true
                              description: Last name of the referred user
                            status:
                              type: string
                              description: Referral claim status (PENDING, CLAIMED, APPROVED, REJECTED)
                              example: "APPROVED"
                            referralStatus:
                              type: string
                              description: Revenue status (PAID, UNPAID)
                              example: "PAID"
                            paymentStatus:
                              type: string
                              nullable: true
                              description: Payment status of the referred user
                              example: "Paid"
                            isUserSubscribed:
                              type: boolean
                              description: Whether the referred user has an active subscription
                              example: true
                            createdAt:
                              type: string
                              format: date-time
                              description: When the referral record was created
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/send-email:
    post:
      tags:
        - Referrals
      summary: Send referral invitation email
      description: |
        Sends a referral invitation email to a potential referral.
        Validates that the recipient is not already registered and not the referrer themselves.
        Automatically sends Slack notification to CSM team.
      operationId: sendReferralEmail
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
              properties:
                firstName:
                  type: string
                  description: First name of the referral
                  example: "John"
                lastName:
                  type: string
                  description: Last name of the referral
                  example: "Doe"
                middleName:
                  type: string
                  description: Middle name of the referral (optional)
                  example: "Michael"
                email:
                  type: string
                  format: email
                  description: Email of the referral
                  example: "john.doe@example.com"
                phoneNumber:
                  type: string
                  description: Phone number of the referral (optional)
                  example: "+1234567890"
      responses:
        "200":
          description: Referral email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral email sent successfully"
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "Referral email sent successfully"
                      referralLink:
                        type: string
                        description: The referral link sent to the potential referral
                        example: "https://rat.cvtocareer.com/register?ref=PARTNER123"
        "400":
          description: Bad request - missing fields, self-referral, or user already registered
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/claim:
    post:
      tags:
        - Referrals
      summary: Claim a referral
      description: |
        Validates that the authenticated user was referred by the provided referrer details.
        Updates the referral status to CLAIMED and updates referrer stats.
        Sends Slack notification and email notification to the referrer.
      operationId: claimReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
              properties:
                firstName:
                  type: string
                  description: First name of the authenticated user
                  example: "Jane"
                lastName:
                  type: string
                  description: Last name of the authenticated user
                  example: "Smith"
                middleName:
                  type: string
                  description: Middle name of the authenticated user (optional)
                  example: "Ann"
                email:
                  type: string
                  format: email
                  description: Email of the referrer
                  example: "referrer@example.com"
                phoneNumber:
                  type: string
                  description: Phone number of the referrer (optional)
                  example: "+1234567890"
      responses:
        "200":
          description: Referral claimed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral claimed successfully"
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "Referral claimed successfully"
                      referrerName:
                        type: string
                        description: Full name of the referrer
                        example: "John Doe"
        "400":
          description: Bad request - missing fields or invalid referral claim
        "401":
          description: Unauthorized
        "404":
          description: Referrer not found
        "500":
          description: Server error

  /v1/referrals/bulk-upload:
    post:
      tags:
        - Referrals
      summary: Bulk upload referrals from spreadsheet
      description: |
        Bulk queues referral invitation emails for multiple potential referrals.
        Skips any referrals where the email matches the authenticated user's own email.
        Automatically sends Slack notification to CSM team with counts.
      operationId: bulkUploadReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referrals
              properties:
                referrals:
                  type: array
                  description: Array of referral objects
                  items:
                    type: object
                    required:
                      - firstName
                      - lastName
                      - email
                    properties:
                      firstName:
                        type: string
                        description: First name of the referral
                        example: "Alice"
                      lastName:
                        type: string
                        description: Last name of the referral
                        example: "Johnson"
                      middleName:
                        type: string
                        description: Middle name of the referral (optional)
                        example: "Marie"
                      email:
                        type: string
                        format: email
                        description: Email of the referral
                        example: "alice@example.com"
                      phoneNumber:
                        type: string
                        description: Phone number of the referral (optional)
                        example: "+1234567890"
      responses:
        "200":
          description: Bulk referral emails queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Successfully queued 5 referral emails"
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "Successfully queued 5 referral emails"
                      totalSent:
                        type: integer
                        description: Number of emails successfully queued
                        example: 5
                      failed:
                        type: integer
                        description: Number of emails that failed (self-referrals)
                        example: 1
                      failedEmails:
                        type: array
                        items:
                          type: string
                          format: email
                        description: List of emails that failed
                        example: ["self@example.com"]
        "400":
          description: Bad request - missing or empty referrals array
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/approve:
    post:
      tags:
        - Referrals
      summary: Approve referral claim
      description: |
        Approve a pending referral claim.
        Automatically sends Slack notification to CSM team.
      operationId: approveReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referralId
              properties:
                referralId:
                  type: string
                  format: uuid
                  description: ID of referral to approve
      responses:
        "200":
          description: Referral approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral approved successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/decline:
    post:
      tags:
        - Referrals
      summary: Decline referral claim
      description: |
        Decline a pending referral claim.
        Automatically sends Slack notification to CSM team.
      operationId: declineReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referralId
              properties:
                referralId:
                  type: string
                  format: uuid
                  description: ID of referral to decline
                reason:
                  type: string
                  description: Reason for declining (optional)
                  example: "Invalid referral claim"
      responses:
        "200":
          description: Referral declined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral declined successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/{referralId}:
    delete:
      tags:
        - Referrals
      summary: Soft-delete a referral record
      description: |
        Soft-delete a referral record by setting isDeleted to true.
        Automatically sends Slack notification to CSM team.
      operationId: deleteReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          description: ID of referral to delete
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Referral deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral deleted successfully"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/{referralId}/restore:
    patch:
      tags:
        - Referrals
      summary: Restore a soft-deleted referral record
      description: |
        Restore a soft-deleted referral record by setting isDeleted to false.
        Automatically sends Slack notification to CSM team.
      operationId: restoreReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          description: ID of referral to restore
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Referral restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral restored successfully"
        "400":
          description: Invalid referral ID or referral is not deleted
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/{referralId}/permanent:
    delete:
      tags:
        - Referrals
      summary: Permanently delete a referral record
      description: |
        Permanently remove a referral record from the database.
        Automatically sends Slack notification to CSM team.
      operationId: permanentDeleteReferral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: referralId
          in: path
          required: true
          description: ID of referral to permanently delete
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Referral permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Referral permanently deleted"
        "400":
          description: Invalid referral ID
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/referrals/user/{userId}:
    get:
      tags:
        - Referrals
      summary: Get referrals for specific user
      description: Fetch all referrals made by a specific user
      operationId: getUserReferrals
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of user to get referrals for
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      referrals:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            status:
                              type: string
                              example: "APPROVED"
                            createdAt:
                              type: string
                              format: date-time
                      totalReferrals:
                        type: integer
                        description: Total number of referrals
                      totalSuccessfulReferrals:
                        type: integer
                        description: Number of approved referrals
        "400":
          description: Invalid user ID
        "401":
          description: Unauthorized
        "500":
          description: Server error