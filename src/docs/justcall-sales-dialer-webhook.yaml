                          sentence: "Hi."
                          timestamp:
                            starttime: 7
                            endtime: 8
                        - speaker_id: 0
                          sentence: "Hello! I understand you guys are on our platform. I was looking to check if you're interested in getting a demo of the product."
                          timestamp:
                            starttime: 5
                            endtime: 19
                      call_summary: >-
                        Call Summary: Robert is interested in a demo and asks
                        about phone numbers. John explains local numbers are
                        available on request and will send required
                        documents plus a demo scheduling link by email.
                      action_items: []
      responses:
        '200':
          description: Sales Dialer call event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  summary: Sales Dialer call event recorded
                  value:
                    success: true
                    message: "Sales Dialer call event recorded"
                    statusCode: 200
        '401':
          description: Missing or invalid x-webhook-secret header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_secret:
                  summary: Invalid webhook secret
                  value:
                    success: false
                    message: "Invalid webhook secret"
                    statusCode: 401
