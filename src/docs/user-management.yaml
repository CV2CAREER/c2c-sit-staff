# OpenAPI Specification for User Management Endpoints

paths:
  /v1/user-management/users/{userId}:
    patch:
      tags:
        - User Management
      summary: Update user details
      description: |
        Update any user profile information.
        
        Accessible only by Admin and Assistant roles.
        **Only fields that actually changed will be updated.**
        Full audit trail is created for all changes.
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: User's first name
                middleName:
                  type: string
                  description: User's middle name
                lastName:
                  type: string
                  description: User's last name
                gender:
                  type: string
                  description: User's gender
                email:
                  type: string
                  format: email
                  description: User's email address
                customerClass:
                  type: string
                  description: Customer classification tier
                voiceNumber:
                  type: string
                  description: Voice contact phone number
                whatsappNumber:
                  type: string
                  description: WhatsApp contact number
                country:
                  type: string
                  description: User's country
                heritage:
                  type: string
                  description: User's heritage / ethnicity
                communication:
                  type: string
                  description: Preferred communication method
                role:
                  type: string
                  enum: [guest, coach, admin, assistant, technology, cse, partner, sales, client]
                  description: User system role
                returnCount:
                  type: number
                  description: Total number of returns
                revenue:
                  type: number
                  description: Total revenue generated
                cl:
                  type: number
                  description: C/L performance metric
                cr:
                  type: number
                  description: C/R performance metric
                socials:
                  type: object
                  description: Social media profile links
                progress:
                  type: number
                  description: User progress percentage
                isActive:
                  type: boolean
                  description: Active status
                isEmailVerified:
                  type: boolean
                  description: Email verification status
                planId:
                  type: string
                  description: Subscription plan ID
                phone:
                  type: string
                  description: Primary phone number
                address:
                  type: string
                  description: Physical address
                city:
                  type: string
                  description: City
                state:
                  type: string
                  description: State / Province
                zipCode:
                  type: string
                  description: Postal / Zip code
                company:
                  type: string
                  description: Company name
                jobTitle:
                  type: string
                  description: Job title
                bio:
                  type: string
                  description: User biography
                website:
                  type: string
                  description: Personal website URL
                linkedinUrl:
                  type: string
                  description: LinkedIn profile URL
              example:
                firstName: "John"
                lastName: "Doe"
                role: "coach"
                isActive: true
                customerClass: "Premium"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Success message
                  statusCode:
                    type: number
                    description: HTTP status code
                  data:
                    type: object
                    description: Updated user object
              examples:
                update_success:
                  summary: Successful user update
                  value:
                    success: true
                    message: "User updated successfully"
                    statusCode: 200
                    data:
                      id: "user-uuid-123"
                      firstName: "John"
                      lastName: "Doe"
                      email: "john.doe@example.com"
                      role: "coach"
                      isActive: true
                      isEmailVerified: true
                      createdAt: "2026-04-20T12:00:00.000Z"
                      updatedAt: "2026-04-23T21:00:00.000Z"
        '400':
          description: Invalid request or validation error
        '403':
          description: Insufficient permissions (only Admin/Assistant allowed)
        '404':
          description: User not found

    delete:
      tags:
        - User Management
      summary: Delete user (soft delete)
      description: |
        Soft delete a user account (move to recycle bin).
        
        Accessible only by Admin and Assistant roles.
        Cannot delete your own account.
        Cannot delete last remaining admin user.
        Creates audit trail entry.
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user to delete
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Invalid user ID or cannot delete own account / last admin
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/restore:
    post:
      tags:
        - User Management
      summary: Restore soft deleted user
      description: |
        Restore a user account that was previously soft deleted.
        
        Accessible only by Admin and Assistant roles.
        Restores all user data and associated records.
        Creates audit trail entry.
      operationId: restoreUser
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user to restore
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User restored successfully
        '400':
          description: Invalid user ID or user is not deleted
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/purge:
    delete:
      tags:
        - User Management
      summary: Permanently delete user
      description: |
        Permanently delete a user account and all associated data (irreversible).
        
        Accessible only by Admin roles.
        This action cannot be undone.
        User must be soft deleted first before purging.
        All user records including audit history will be removed.
      operationId: purgeUser
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user to permanently delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User permanently deleted successfully
        '400':
          description: Invalid user ID or cannot purge active account
        '403':
          description: Insufficient permissions (Admin only)
        '404':
          description: User not found

  /v1/user-management/users/documents/{documentId}/approve:
    post:
      tags:
        - User Management
      summary: Approve user document
      description: |
        Approve an uploaded document.
        
        Accessible only by Admin and Assistant roles.
        Updates both Upload model and User document status.
      operationId: approveUserDocument
      parameters:
        - name: documentId
          in: path
          required: true
          description: UUID of document to approve
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document approved successfully
        '400':
          description: Invalid document ID
        '403':
          description: Insufficient permissions
        '404':
          description: Document not found

  /v1/user-management/documents/{documentId}/reject:
    post:
      tags:
        - User Management
      summary: Reject user document
      description: |
        Reject an uploaded document with reason.
        
        Accessible only by Admin and Assistant roles.
        Updates both Upload model and User document status.
      operationId: rejectUserDocument
      parameters:
        - name: documentId
          in: path
          required: true
          description: UUID of document to reject
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: Reason for rejection
      responses:
        '200':
          description: Document rejected successfully
        '400':
          description: Invalid request
        '403':
          description: Insufficient permissions
        '404':
          description: Document not found

  /v1/user-management/users/{userId}/documents/pending:
    get:
      tags:
        - User Management
      summary: Get pending documents for user
      description: |
        Get all pending (unreviewed) documents for a specific user.
        
        Accessible only by Admin and Assistant roles.
      operationId: getPendingDocumentsByUserId
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending documents retrieved successfully
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/approve:
    post:
      tags:
        - User Management
      summary: Approve user account
      description: |
        Approve a user account by setting isDocumentApproved flag.
        
        Accessible only by Admin and Assistant roles.
        Returns indication if account was already approved.
        Creates audit trail and sends Slack notification.
      operationId: approveUserAccount
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user to approve
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account approved successfully or already approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always true for successful operations
                  alreadyApproved:
                    type: boolean
                    description: True if account was already approved, false if newly approved
                  message:
                    type: string
                    description: Status message ("Account approved successfully" or "Account already approved")
                  user:
                    type: object
                    description: Updated user object
              examples:
                newly_approved:
                  summary: Account newly approved
                  value:
                    success: true
                    alreadyApproved: false
                    message: "Account approved successfully"
                    user: { /* user object */ }
                already_approved:
                  summary: Account was already approved
                  value:
                    success: true
                    alreadyApproved: true
                    message: "Account already approved"
                    user: { /* user object */ }
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/send-slack-sample:
    post:
      tags:
        - User Management
      summary: Send user details sample to Slack
      description: |
        Send formatted user profile details to Slack channel.
        
        Accessible only by Admin and Assistant roles.
        Sends user's name, email, status, class and other profile details.
      operationId: sendUserDetailsToSlack
      parameters:
        - name: userId
          in: path
          required: true
          description: UUID of user
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details sent to Slack successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always true for successful operations
                  message:
                    type: string
                    description: Success message
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/features:
    get:
      tags:
        - User Management
      summary: Get all feature titles
      description: Retrieve all available feature titles from the system
      operationId: getFeatureTitles
      responses:
        '200':
          description: Features retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Feature titles retrieved successfully"
                  data:
                    type: object
                    properties:
                      features:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                              example: "Resume Review"
                            description:
                              type: string
                              example: "Professional resume review service"
                            isActive:
                              type: boolean
                              example: true
        '403':
          description: Insufficient permissions

  /v1/user-management/users/{userId}/preferences:
    get:
      tags:
        - User Management
      summary: Get user preferences
      description: Get user preferences including both primary and secondary profiles
      operationId: getUserPreferences
      parameters:
        - name: userId
          in: path
          description: ID of user
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User preferences retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User preferences retrieved successfully"
                  data:
                    type: object
                    properties:
                      primary:
                        type: object
                        description: Primary profile data with all fields
                      secondary:
                        type: object
                        description: Secondary profile data with all fields
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            example: "user@example.com"
                          firstName:
                            type: string
                          lastName:
                            type: string
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/preferences/history:
    get:
      tags:
        - User Management
      summary: Get job preferences history
      description: Get complete history of job preference changes for a user
      operationId: getJobPreferencesHistory
      parameters:
        - name: userId
          in: path
          description: ID of user
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job preferences history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Job preferences history retrieved successfully"
                  data:
                    type: object
                    properties:
                      history:
                        type: array
                        items:
                          type: object
                          description: User preference history entries
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/referrals:
    get:
      tags:
        - User Management
      summary: Get user referrals
      description: Get all users that were referred by the specified user
      operationId: getUserReferrals
      parameters:
        - name: userId
          in: path
          description: ID of referrer user
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User referrals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User referrals retrieved successfully"
                  data:
                    type: object
                    properties:
                      referrals:
                        type: array
                        items:
                          type: object
                      count:
                        type: integer
                        example: 7
                      referrer:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          firstname:
                            type: string
                          lastName:
                            type: string
                          phoneNumber:
                            type: string
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/documents:
    get:
      tags:
        - User Management
      summary: Get user uploaded documents
      description: |
        Get all uploaded documents for a specific user.
        
        Accessible only by Admin and Assistant roles.
        Returns all document uploads including pending, approved and rejected.
      operationId: getUserUploadedDocuments
      parameters:
        - name: userId
          in: path
          description: UUID of user
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User uploaded documents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User uploaded documents retrieved successfully"
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          type: object
                          description: Uploaded document objects
                      count:
                        type: integer
                        example: 3
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            example: "user@example.com"
                          firstName:
                            type: string
                          lastName:
                            type: string
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/profile:
    get:
      tags:
        - User Management
      summary: Get user profile (safe)
      description: |
        Get user profile with all sensitive data automatically excluded.

        Accessible only by Admin and Assistant roles.
        Automatically removes passwords, tokens and other sensitive fields.
      operationId: getUserProfile
      parameters:
        - name: userId
          in: path
          description: UUID of user
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User profile retrieved successfully"
                  data:
                    type: object
                    properties:
                      profile:
                        type: object
                        description: Complete user profile without sensitive fields
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions
        '404':
          description: User not found

  /v1/user-management/users/{userId}/progress:
    get:
      tags:
        - User Management
      summary: Get user progress
      description: |
        Get the current progress stage of a specific user.

        Accessible only by Admin and Assistant roles.
        Returns the user's progress enum value alongside basic identifying info.
      operationId: getUserProgress
      parameters:
        - name: userId
          in: path
          description: UUID of user
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User progress retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User progress retrieved successfully"
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                        example: "b3f1c2d4-e5a6-7890-bcde-f01234567890"
                      firstName:
                        type: string
                        example: "Jane"
                      lastName:
                        type: string
                        example: "Doe"
                      email:
                        type: string
                        format: email
                        example: "jane.doe@example.com"
                      role:
                        type: string
                        example: "client"
                      progress:
                        type: string
                        enum:
                          - "Onboarding"
                          - "Email Verified"
                          - "Documents Accepted"
                          - "Documents Declined"
                          - "CV/Resume Uplifted"
                          - "Payment Initiated"
                          - "Plan Selected"
                          - "Followed on Socials"
                          - "Payment Confirmed"
                          - "Login Credentials Verified"
                          - "Sample Results Dispatched"
                          - "Sample Results Accepted"
                          - "Preferences Updated"
                          - "Preparatory Session Accepted"
                          - "Preparatory Session Declined"
                          - "Application Commenced"
                          - "Application Hold"
                          - "Application Expired"
                          - "Offer Notification Received"
                          - "Campaign Ended"
                          - "Prospect"
                        example: "Payment Confirmed"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2026-04-30T10:23:00.000Z"
              examples:
                progress_success:
                  summary: Progress retrieved
                  value:
                    success: true
                    message: "User progress retrieved successfully"
                    statusCode: 200
                    data:
                      userId: "b3f1c2d4-e5a6-7890-bcde-f01234567890"
                      firstName: "Jane"
                      lastName: "Doe"
                      email: "jane.doe@example.com"
                      role: "client"
                      progress: "Payment Confirmed"
                      updatedAt: "2026-04-30T10:23:00.000Z"
        '400':
          description: Invalid user ID
        '403':
          description: Insufficient permissions (Admin/Assistant only)
        '404':
          description: User not found
