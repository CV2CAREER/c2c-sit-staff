# OpenAPI Specification for C2C Staff Backend API

paths:
  /v1/justcallMessageWebhook/events:
    post:
      tags:
        - Webhook
      summary: Receive JustCall SMS/MMS webhook events
      description: |
        Receives JustCall sms.* webhook payloads - call.* and jc.*
        (AI-analysis) events go to a separate endpoint, see
        justcall-webhook.yaml, since a message's shape has almost no overlap
        with a call's (no call_sid, no call_info, no call_duration).
        `justcall_message_events` holds one current-state row per message,
        keyed on JustCall's message id - a later delivery for the same id
        (e.g. a delivery_status update) updates that row instead of creating
        a duplicate. Every individual delivery is also appended to
        `justcall_message_event_logs` (FK -> justcall_message_events), so the
        full history is never lost even though the current-state row gets
        overwritten.

        An MMS attachment's `sms_info.mms[].media_url` points at JustCall's
        own CDN (Filestack) - a link outside our control that can expire or
        be revoked. This endpoint re-hosts it into our Firebase Storage
        bucket in the background (after acking the webhook) and repoints
        `media_url` at that copy, keeping the original JustCall link
        alongside as `justcall_media_url`.

        Configure this URL as the webhook target in JustCall for whichever
        message event types you want captured - sms.sent, sms.received, etc.

        If `JUSTCALL_WEBHOOK_SECRET` is set in the environment, requests must
        include a matching `x-webhook-secret` header (set this as a custom
        header on the webhook in JustCall's dashboard) or they are rejected
        with 401. If it is unset, the endpoint accepts events unauthenticated.
      security: []
      parameters:
        - name: x-webhook-secret
          in: header
          required: false
          description: Required only if JUSTCALL_WEBHOOK_SECRET is configured.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              sms_sent:
                summary: sms.sent sample payload
                value:
                  request_id: "01HQAMVFRC4HZ0144TDSXXXX"
                  webhook_url: "https://webhook.site/ce74f4ac-1b4ce7805646dd5XXXX"
                  url_id: "65d5a5ed180da91d76edXXXX"
                  type: "sms.sent"
                  data:
                    id: 123455
                    contact_number: "1681381XXXX"
                    contact_name: "Robert Williams"
                    contact_email: "robert.williams@gmail.com"
                    justcall_number: "1213566XXXX"
                    justcall_line_name: "Sales Line"
                    agent_id: 27155
                    agent_name: "John Smith"
                    agent_email: "john.smith@justcall.io"
                    sms_date: "2024-02-23"
                    sms_user_date: "2024-02-23"
                    sms_time: "09:30:58"
                    sms_user_time: "15:00:58"
                    direction: "Outgoing"
                    cost_incurred: 0.05635
                    sms_info:
                      body: >-
                        Hi Robert, John this side from JustCall. This is to
                        inform you that the demo call requested by you has
                        been scheduled for 3pm tomorrow.
                      is_mms: 1
                      mms:
                        - media_url: "https://cdn.filestackcontent.com/nrJtfrrgTlyZFpFXXXX"
                          content_type: "image/png"
                    delivery_status: ""
                    is_deleted: false
                    medium: "One-To-One via App"
              sms_received:
                summary: >-
                  sms.received sample payload - note this reuses the same
                  placeholder message id as sms.sent above (JustCall's own
                  docs do this); a sent and a received message are actually
                  different messages in real usage, so use distinct ids to
                  test them as their own rows.
                value:
                  request_id: "01HQAMVFRC4HZ0144TDSXXXX"
                  webhook_url: "https://webhook.site/ce74f4ac-1b4ce7805646dd5XXXX"
                  url_id: "65d5a5ed180da91d76edXXXX"
                  type: "sms.received"
                  data:
                    id: 123455
                    contact_number: "1681381XXXX"
                    contact_name: "Robert Williams"
                    contact_email: "robert.williams@gmail.com"
                    justcall_number: "1213566XXXX"
                    justcall_line_name: "Sales Line"
                    agent_id: 27155
                    agent_name: "John Smith"
                    agent_email: "john.smith@justcall.io"
                    sms_date: "2024-02-23"
                    sms_user_date: "2024-02-23"
                    sms_time: "09:30:58"
                    sms_user_time: "15:00:58"
                    direction: "Incoming"
                    cost_incurred: 0.05635
                    sms_info:
                      body: >-
                        Hi Robert, John this side from JustCall. This is to
                        inform you that the demo call requested by you has
                        been scheduled for 3pm tomorrow.
                      is_mms: 1
                      mms:
                        - media_url: "https://cdn.filestackcontent.com/nrJtfrrgTlyZFpFXXXX"
                          content_type: "image/png"
                    delivery_status: "received"
                    is_deleted: false
                    medium: "One-To-One via App"
              sms_status_updated:
                summary: >-
                  sms.status_updated sample payload - unlike sms_sent vs
                  sms_received above, this one really is the same message
                  (same id) getting a later delivery_status update
                  ("" -> "sent"), so it's the realistic case for the
                  upsert/merge behavior: it updates the existing row and
                  produces a "Delivery: N/A -> sent" diff line.
                value:
                  request_id: "01HQAMVFRC4HZ0144TDSXXXX"
                  webhook_url: "https://webhook.site/ce74f4ac-1b4ce7805646dd5XXXX"
                  url_id: "65d5a5ed180da91d76edXXXX"
                  type: "sms.status_updated"
                  data:
                    id: 123455
                    contact_number: "1681381XXXX"
                    contact_name: "Robert Williams"
                    contact_email: "robert.williams@gmail.com"
                    justcall_number: "1213566XXXX"
                    justcall_line_name: "Sales Line"
                    agent_id: 27155
                    agent_name: "John Smith"
                    agent_email: "john.smith@justcall.io"
                    sms_date: "2024-02-23"
                    sms_user_date: "2024-02-23"
                    sms_time: "09:30:58"
                    sms_user_time: "15:00:58"
                    direction: "Outgoing"
                    cost_incurred: 0.05635
                    sms_info:
                      body: >-
                        Hi Robert, John this side from JustCall. This is to
                        inform you that the demo call requested by you has
                        been scheduled for 3pm tomorrow.
                      is_mms: 1
                      mms:
                        - media_url: "https://cdn.filestackcontent.com/nrJtfrrgTlyZFpFXXXX"
                          content_type: "image/png"
                    delivery_status: "sent"
                    is_deleted: false
                    medium: "One-To-One via App"
              sms_sent_received:
                summary: >-
                  sms.sent_received sample payload - a catch-all event type
                  JustCall fires for either direction instead of the more
                  specific sms.sent/sms.received, but with the identical
                  data shape, so it needs no special handling.
                value:
                  request_id: "01HQAMVFRC4HZ0144TDSXXXX"
                  webhook_url: "https://webhook.site/ce74f4ac-1b4ce7805646dd5XXXX"
                  url_id: "65d5a5ed180da91d76edXXXX"
                  type: "sms.sent_received"
                  data:
                    id: 123455
                    contact_number: "1681381XXXX"
                    contact_name: "Robert Williams"
                    contact_email: "robert.williams@gmail.com"
                    justcall_number: "1213566XXXX"
                    justcall_line_name: "Sales Line"
                    agent_id: 27155
                    agent_name: "John Smith"
                    agent_email: "john.smith@justcall.io"
                    sms_date: "2024-02-23"
                    sms_user_date: "2024-02-23"
                    sms_time: "09:30:58"
                    sms_user_time: "15:00:58"
                    direction: "Outgoing"
                    cost_incurred: 0.05635
                    sms_info:
                      body: >-
                        Hi Robert, John this side from JustCall. This is to
                        inform you that the demo call requested by you has
                        been scheduled for 3pm tomorrow.
                      is_mms: 1
                      mms:
                        - media_url: "https://cdn.filestackcontent.com/nrJtfrrgTlyZFpFXXXX"
                          content_type: "image/png"
                    delivery_status: ""
                    is_deleted: false
                    medium: "One-To-One via App"
      responses:
        '200':
          description: Message event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  summary: Message event recorded
                  value:
                    success: true
                    message: "Message event recorded"
                    statusCode: 200
        '401':
          description: Missing or invalid x-webhook-secret header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_secret:
                  summary: Invalid webhook secret
                  value:
                    success: false
                    message: "Invalid webhook secret"
                    statusCode: 401
