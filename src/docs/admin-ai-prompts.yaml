paths:
  /v1/admin/ai-prompts:
    get:
      tags:
        - Admin AI Prompts
      summary: Get all AI prompts, categories and simulations
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: AI prompts retrieved successfully

    post:
      tags:
        - Admin AI Prompts
      summary: Create AI prompt or category
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [category]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created successfully

    put:
      tags:
        - Admin AI Prompts
      summary: Update AI prompt
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated successfully

    delete:
      tags:
        - Admin AI Prompts
      summary: Delete AI prompt or category
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [category]
      responses:
        "200":
          description: Deleted successfully
