paths:
  /v1/admin/ai-prompt-queue:
    get:
      tags:
        - Admin AI Prompt Queue
      summary: Get AI prompt queue
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Queue retrieved

    post:
      tags:
        - Admin AI Prompt Queue
      summary: Add item to queue
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
      responses:
        "200":
          description: Added to queue

    delete:
      tags:
        - Admin AI Prompt Queue
      summary: Clear queue
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Queue cleared
