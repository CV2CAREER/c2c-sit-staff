# OpenAPI Specification for Resources Management Endpoints

paths:
  /v1/resources:
    get:
      tags:
        - Resources
      summary: Get resources
      description: Retrieve all resources or a specific resource by type/name
      operationId: getResources
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          description: Optional resource name to retrieve single resource
      responses:
        "200":
          description: Resources retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All Resources retrieved Successfully"
                  data:
                    oneOf:
                      - type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: stringng
                              description: Resource ID
                            name:
                              type: string
                              description: Resource name (uppercase with underscores)
                            value:
                              type: string
                              description: Resource value
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                      - type: object
                        properties:
                          id:
                            type: string
                            format: string
                            description: Resource ID
                          name:
                            type: string
                            description: Resource name (uppercase with underscores)
                          value:
                            type: string
                            description: Resource value
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
        "401":
          description: Unauthorized
        "500":
          description: Server error while retrieving resources

    post:
      tags:
        - Resources
      summary: Create resource
      description: |
        Create a new resource.
        Only users with ADMIN or ASSISTANT (PC) roles are authorized.
        Resource names are automatically converted to UPPERCASE_WITH_UNDERSCORES.
      operationId: createResource
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceName
                - value
              properties:
                resourceName:
                  type: string
                  minLength: 3
                  maxLength: 25
                  description: Resource name (3-25 characters)
                  example: "MAX_APPLICATIONS_PER_DAY"
                value:
                  type: string
                  description: Resource value
                  example: "100"
      responses:
        "200":
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Resource Created Successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: string
                      name:
                        type: string
                      value:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid request or duplicate resource
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Only admins and assistants can create resources
        "500":
          description: Server error while creating resource

    put:
      tags:
        - Resources
      summary: Update resource (upsert)
      description: |
        Update an existing resource or create if it doesn't exist.
        Only users with ADMIN or ASSISTANT (PC) roles are authorized.
        Resource names are automatically converted to UPPERCASE_WITH_UNDERSCORES.
      operationId: updateResource
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceName
                - value
              properties:
                resourceName:
                  type: string
                  minLength: 3
                  maxLength: 25
                  description: Resource name (3-25 characters)
                  example: "MAX_APPLICATIONS_PER_DAY"
                value:
                  type: string
                  description: New resource value
                  example: "150"
      responses:
        "200":
          description: Resource updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Resource Updated Successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: string
                      name:
                        type: string
                      value:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Only admins and assistants can update resources
        "500":
          description: Server error while updating resource

    delete:
      tags:
        - Resources
      summary: Delete resource
      description: |
        Delete an existing resource by ID.
        Only users with ADMIN or ASSISTANT (PC) roles are authorized.
      operationId: deleteResource
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: resource_id
          required: true
          schema:
            type: string
            format: string
          description: Resource ID to delete
      responses:
        "200":
          description: Resource deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Resource deleted Successfully"
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: number
                        example: 1
        "400":
          description: Invalid request - missing resource_id
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Only admins and assistants can delete resources
        "404":
          description: Resource not found
        "500":
          description: Server error while deleting resource