# OpenAPI Specification for Admin Analytics Endpoint

paths:
  /v1/admin/analytics:
    get:
      tags:
        - Admin
      summary: Get admin analytics metrics
      description: |
        Returns high-performance aggregate metrics for Successful vs Failed records.
        This endpoint is admin-only and supports optional date-window filtering.
        Metrics include plans, users, and applications (when the applications table exists).
        Default dashboard metrics are pre-calculated in BullMQ every 6 hours and served from Redis cache.
        Date-only ranges (YYYY-MM-DD) and whole-day aligned windows are served by summing a precomputed daily cache series when available.
        Response also includes near-real-time subscription-tier user counts used by the Analytics Header and Tier Overview cards.
      operationId: getAdminAnalytics
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
          description: ISO-8601 start date (inclusive). Also accepts YYYY-MM-DD. Defaults to 30 days before `to`.
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
          description: ISO-8601 end date (exclusive). Also accepts YYYY-MM-DD. Defaults to current time.
        - in: query
          name: startDate
          required: false
          schema:
            type: string
          description: Alias for `from` used by the admin UI (accepts YYYY-MM-DD or ISO date-time).
        - in: query
          name: endDate
          required: false
          schema:
            type: string
          description: Alias for `to` used by the admin UI (accepts YYYY-MM-DD or ISO date-time).
      responses:
        "200":
          description: Analytics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  statusCode:
                    type: number
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                      metrics:
                        type: object
                        properties:
                          successful:
                            type: number
                          failed:
                            type: number
                      breakdown:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            successful:
                              type: number
                            failed:
                              type: number
                      subscriptionTiers:
                        type: object
                        properties:
                          tiers:
                            type: array
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                label:
                                  type: string
                                users:
                                  type: number
                          allPaidTierCounts:
                            type: object
                            additionalProperties:
                              type: number
                          totals:
                            type: object
                            properties:
                              sixTierUsers:
                                type: number
                              activeSubscribers:
                                type: number
                              activeSubscriptions:
                                type: number
                          generatedAt:
                            type: string
                            format: date-time
                      generatedAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid date query parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin role required
