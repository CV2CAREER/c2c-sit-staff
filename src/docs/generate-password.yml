paths:
  /v1/admin/generate-password:
    post:
      tags:
        - Generate Password
      summary: Generate password
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
      responses:
        "200":
          description: Password generated

    update:
      tags:
        - Update password
      summary: update password
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: password updated
