# OpenAPI Specification for C2C Staff Backend API

paths:
  /v1/justcallWebhook/events:
    post:
      tags:
        - Webhook
      summary: Receive JustCall call/AI-analysis webhook events
      description: |
        Receives JustCall call.* and jc.* (AI-analysis) webhook payloads -
        SMS/MMS events (sms.*) go to a separate endpoint, see
        justcall-message-webhook.yaml, since a message's shape has almost no
        overlap with a call's. `justcall_events` holds one current-state row
        per call, keyed on call_sid - later deliveries for the same call_sid
        (e.g. call.initiated -> call.ringing -> call.completed) update that
        row instead of creating duplicates. Every individual delivery is also
        appended to `justcall_event_logs` (FK -> justcall_events), so the
        full history is never lost even though the current-state row gets
        overwritten - each log row carries its own `changes` summary (empty
        for the first delivery) plus the full raw payload for that delivery.

        Configure this URL as the webhook target in JustCall for whichever
        call/AI event types you want captured - call.initiated, call.ringing,
        call.completed, call.updated, jc.call_ai_generated, etc. Not every
        delivery is a full snapshot - call.updated, for example, only carries
        the fields that actually changed (disposition/notes/rating), omitting
        contact/agent/duration info a fuller event already gave us. Each
        delivery's whole body is deep-merged onto whatever is already on file
        for that call_sid before being stored, so a partial delivery can't
        null out data a fuller one already captured; the untouched raw body
        for each individual delivery is still preserved verbatim in its
        `justcall_event_logs` row.

        If `JUSTCALL_WEBHOOK_SECRET` is set in the environment, requests must
        include a matching `x-webhook-secret` header (set this as a custom
        header on the webhook in JustCall's dashboard) or they are rejected
        with 401. If it is unset, the endpoint accepts events unauthenticated.
      security: []
      parameters:
        - name: x-webhook-secret
          in: header
          required: false
          description: Required only if JUSTCALL_WEBHOOK_SECRET is configured.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              call_initiated:
                summary: call.initiated sample payload
