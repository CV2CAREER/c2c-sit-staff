# OpenAPI Specification for Admin Interview Q&A Endpoints

paths:
  /v1/admin/interview-prep:
    get:
      tags:
        - Admin Interview Prep
      summary: Get all interview Q&A records
      description: |
        Fetch all interview preparation question and answer records with optional filtering by isDeleted.
        Defaults to returning only non-deleted records when isDeleted is omitted.
        Returns paginated results with associated user info.
      operationId: getInterviewQnA
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of records per page
          schema:
            type: integer
            default: 15
            minimum: 1
        - name: isDeleted
          in: query
          required: false
          description: |
            Filter by soft-delete status.
            Omit to return only active records (isDeleted = false).
            Pass `true` to return only deleted records.
          schema:
            type: boolean
      responses:
        "200":
          description: Interview Q&A records retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Interview Q&A records retrieved successfully"
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InterviewPrepRecord"
                      pagination:
                        type: object
                        properties:
                          totalCount:
                            type: integer
                            description: Total records matching the filters
                            example: 5
                          currentPage:
                            type: integer
                            example: 1
                          pageSize:
                            type: integer
                            example: 15
                          totalPages:
                            type: integer
                            example: 1
              example:
                success: true
                message: "Interview Q&A records retrieved successfully"
                data:
                  data:
                    - id: "ad4021ad-11a8-49d3-af24-057f1387958a"
                      userId: "c4c1c1e7-671e-4dbf-959e-2a59c9679dc1"
                      isEmailSent: false
                      userRole: ""
                      jobLink: "https://au.seek.com/job/91854872"
                      interviewerInformation: "Here at Healthscope…"
                      uploadedDocuments:
                        - fileUrl: "https://storage.googleapis.com/cvtocareer-394713.appspot.com/documents/..."
                          filename: ""
                          cloudFilename: ""
                      interview:
                        interview:
                          - index: 1
                            question: "Can you describe your experience with perioperative nursing?"
                            answer: "During my anaesthetic placement…"
                          - index: 2
                            question: "How have you applied infection prevention protocols?"
                            answer: "In every role I have followed…"
                      isDeleted: false
                      updatedBy: null
                      createdAt: "2026-05-03T20:09:07.998Z"
                      updatedAt: "2026-05-03T20:09:07.998Z"
                      user:
                        id: "c4c1c1e7-671e-4dbf-959e-2a59c9679dc1"
                        email: "helsaokporho@gmail.com"
                        firstName: "RAT"
                        lastName: "PREPINT"
                  pagination:
                    totalCount: 5
                    currentPage: 1
                    pageSize: 15
                    totalPages: 1
        "401":
          description: Unauthorized
        "500":
          description: Server error

  /v1/admin/interview-prep/{prepId}:
    delete:
      tags:
        - Admin Interview Prep
      summary: Soft-delete an interview Q&A record
      description: |
        Sets isDeleted = true on the record.
        Sends a Slack notification to the CSM team.
        Returns 500 if the record is already deleted.
      operationId: softDeleteInterviewQnA
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: prepId
          in: path
          required: true
          description: UUID of the interview Q&A record to soft-delete
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interview Q&A record deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Record ID is required
        "401":
          description: Unauthorized
        "500":
          description: Record not found or already deleted

  /v1/admin/interview-prep/{prepId}/restore:
    patch:
      tags:
        - Admin Interview Prep
      summary: Restore a soft-deleted interview Q&A record
      description: |
        Sets isDeleted = false on the record.
        Sends a Slack notification to the CSM team.
        Returns 500 if the record is not currently deleted.
      operationId: restoreInterviewQnA
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: prepId
          in: path
          required: true
          description: UUID of the interview Q&A record to restore
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interview Q&A record restored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Record ID is required
        "401":
          description: Unauthorized
        "500":
          description: Record not found or not in deleted state

  /v1/admin/interview-prep/{prepId}/permanent:
    delete:
      tags:
        - Admin Interview Prep
      summary: Permanently delete an interview Q&A record
      description: |
        Irreversibly removes the interview Q&A record from the database.
        Sends a Slack notification to the CSM team.
        This action cannot be undone.
      operationId: permanentDeleteInterviewQnA
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: prepId
          in: path
          required: true
          description: UUID of the interview Q&A record to permanently delete
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interview Q&A record permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Record ID is required
        "401":
          description: Unauthorized
        "500":
          description: Record not found

components:
  schemas:
    InterviewQnAItem:
      type: object
      description: A single interview question and answer pair
      properties:
        index:
          type: integer
          description: 1-based position of the Q&A in the interview
          example: 1
        question:
          type: string
          description: Interview question generated for the job
          example: "Can you describe your experience with perioperative nursing?"
        answer:
          type: string
          description: AI-generated or user-provided answer
          example: "During my anaesthetic placement at Princess Alexandra Hospital…"

    InterviewWrapper:
      type: object
      description: |
        JSONB wrapper stored in the database.
        The top-level key is `interview` and its value is the array of Q&A items.
      properties:
        interview:
          type: array
          items:
            $ref: "#/components/schemas/InterviewQnAItem"

    UploadedDocument:
      type: object
      description: A document uploaded by the user as context for the interview prep
      properties:
        fileUrl:
          type: string
          description: Publicly accessible URL of the uploaded document
          example: "https://storage.googleapis.com/cvtocareer-394713.appspot.com/documents/..."
        filename:
          type: string
          description: Internal filename (may be empty)
          example: ""
        cloudFilename:
          type: string
          description: Cloud storage filename (may be empty)
          example: ""

    InterviewPrepRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "ad4021ad-11a8-49d3-af24-057f1387958a"
        userId:
          type: string
          description: Foreign key to the User who owns this record
          example: "c4c1c1e7-671e-4dbf-959e-2a59c9679dc1"
        isEmailSent:
          type: boolean
          description: Whether the prep summary email has been sent to the user
          example: false
        userRole:
          type: string
          description: Role/job title of the user at time of prep (may be empty string)
          example: ""
        jobLink:
          type: string
          description: URL of the job listing this prep was generated for
          example: "https://au.seek.com/job/91854872/apply"
        interviewerInformation:
          type: string
          description: Full job description / interviewer context used to generate questions
          example: "Here at Healthscope in our graduate program…"
        uploadedDocuments:
          type: array
          description: Documents (e.g. CV/resume) uploaded by the user as prep context
          items:
            $ref: "#/components/schemas/UploadedDocument"
        interview:
          $ref: "#/components/schemas/InterviewWrapper"
          description: |
            JSONB field containing the generated interview Q&A.
            Shape: `{ interview: [ { index, question, answer }, … ] }`
        isDeleted:
          type: boolean
          description: Soft-delete flag
          example: false
        updatedBy:
          type: string
          nullable: true
          description: Name or email of the admin who last modified this record
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-05-03T20:09:07.998Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-03T20:09:07.998Z"
        user:
          type: object
          nullable: true
          description: Associated user (joined via userId)
          properties:
            id:
              type: string
              format: uuid
              example: "c4c1c1e7-671e-4dbf-959e-2a59c9679dc1"
            email:
              type: string
              format: email
              example: "helsaokporho@gmail.com"
            firstName:
              type: string
              example: "RAT"
            lastName:
              type: string
              example: "PREPINT"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
