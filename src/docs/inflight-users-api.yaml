# OpenAPI specification for Inflight Users API

paths:
  /v1/user-management/users/inflight:
    get:
      tags:
        - Dashboard API
      summary: Get all users with INFLIGHT campaigns
      description: Retrieves a list of all users whose credentials have capitalized status set to INFLIGHT
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Users with INFLIGHT campaigns retrieved successfully"
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "uuid"
                            firstName:
                              type: string
                              example: "John"
                            lastName:
                              type: string
                              example: "Doe"
                            email:
                              type: string
                              example: "john.doe@example.com"
                            role:
                              type: string
                              example: "client"
                            isActive:
                              type: boolean
                              example: true
                            isDocumentApproved:
                              type: boolean
                              example: true
                      count:
                        type: integer
                        example: 5
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT