# OpenAPI Specification for Admin Schema Management Endpoints

paths:
  /v1/admin/schema/{tableName}/columns:
    get:
      tags:
        - Admin
      summary: List columns for a schema-managed table
      description: |
        Lists columns for a table in `SCHEMA_MANAGED_TABLES`.
      operationId: getSchemaColumns
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema columns retrieved successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin role required

  /v1/admin/schema/expand:
    post:
      tags:
        - Admin
      summary: Expand a table schema by adding a column
      description: |
        Adds a nullable column (no default) to avoid heavy table rewrites.
        Only allowlisted tables are permitted via `SCHEMA_MANAGED_TABLES`.
      operationId: postSchemaExpandColumn
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, columnName, type]
              properties:
                tableName:
                  type: string
                columnName:
                  type: string
                type:
                  type: string
                  enum: ["text", "string", "integer", "boolean", "jsonb", "timestamp", "date", "numeric"]
      responses:
        "200":
          description: Schema column expanded successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin role required or table not allowlisted

  /v1/admin/schema/{tableName}/columns/{columnName}:
    delete:
      tags:
        - Admin
      summary: Delete a column from a schema-managed table
      description: |
        Deletes a column from an allowlisted table.
      operationId: deleteSchemaColumn
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
        - in: path
          name: columnName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema column deleted successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin role required or table not allowlisted

