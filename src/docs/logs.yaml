# OpenAPI Specification for Logs Endpoints

paths:
  /v1/logs:
    get:
      tags:
        - Logs
      summary: Get paginated system logs
      description: Retrieve audit logs with pagination and sorting. Only accessible by Admin roles.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of records per page
        - in: query
          name: column
          schema:
            type: string
            enum: [id, origin, title, type, createdAt]
            default: id
          description: Sort column
        - in: query
          name: direction
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort direction
      responses:
        "200":
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 124
                        origin:
                          type: string
                          example: "CV Analysis Service"
                        title:
                          type: string
                          example: "Resume processed"
                        type:
                          type: string
                          example: "cv_ai_log"
                        summary:
                          type: string
                          example: "Extracted skills from resume"
                        createdAt:
                          type: string
                          format: date-time
                  count:
                    type: number
                    example: 1523
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin only
        "500":
          description: Internal server error

  /v1/logs/export/csv:
    get:
      tags:
        - Logs
      summary: Export logs to CSV
      description: Exports system audit logs as downloadable CSV file. Supports date range and type filtering. Only accessible by Admin roles.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
            example: "2026-01-01"
          description: Filter logs created on or after this date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
            example: "2026-01-31"
          description: Filter logs created on or before this date
        - in: query
          name: type
          schema:
            type: string
            example: "ai_log"
          description: Filter by specific log type
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin only
        "500":
          description: Internal server error
