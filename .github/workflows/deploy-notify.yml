name: Deployment Notification

on:
  push:
    branches: [rat, sit, iat, uat, main, stage, staging, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            rat)          echo "env=RAT"     >> "$GITHUB_OUTPUT" ;;
            sit)          echo "env=SIT"     >> "$GITHUB_OUTPUT" ;;
            iat)          echo "env=IAT"     >> "$GITHUB_OUTPUT" ;;
            uat)          echo "env=UAT"     >> "$GITHUB_OUTPUT" ;;
            main|master)  echo "env=PROD"    >> "$GITHUB_OUTPUT" ;;
            stage|staging) echo "env=STAGING" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1 | sed 's/"/\\"/g')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"Deployment to ${{ steps.env.outputs.env }}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Deployment STARTED*\n*Repo:* \`${{ github.repository }}\`\n*Branch:* \`${{ github.ref_name }}\` -> *${{ steps.env.outputs.env }}*\n*By:* ${{ github.actor }}\n*Commit:* \`${{ github.sha }}\`\n> ${COMMIT_MSG}\"
                  }
                }
              ]
            }"